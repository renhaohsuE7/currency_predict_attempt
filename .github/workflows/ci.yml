name: CI

on:
  push:
    branches: [main, transfomer_attempt]
  pull_request:
    branches: [main, transfomer_attempt]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Guard - enforce uv (no pip / requirements.txt)
        run: |
          set -e
          if ls requirements*.txt setup.py Pipfile 2>/dev/null; then
            echo "::error::Found pip-style dependency file; this project uses uv (pyproject.toml + uv.lock) only."
            exit 1
          fi
          if grep -rnE "uv pip install|python -m pip install|[^v] pip install" .github/ Dockerfile docker-compose.yml 2>/dev/null; then
            echo "::error::Found pip usage in CI/Docker config; use 'uv add' / 'uv sync' instead."
            exit 1
          fi

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Black check
        run: uv run black --check src/ tests/

      - name: Flake8
        run: uv run flake8 src/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: mypy
        run: uv run mypy src/currency_predictor/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --all-extras --all-groups

      - name: Run fast tests with coverage
        run: uv run pytest --cov=currency_predictor --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra notebook --all-groups

      - name: Verify notebooks are output-stripped
        run: |
          uv run nbstripout --verify notebooks/*.ipynb

      - name: Validate notebooks with papermill (dry-run)
        run: |
          for nb in notebooks/currency_analysis.ipynb notebooks/zhtw_font_test.ipynb; do
            echo "Validating $nb ..."
            uv run python -c "
          import nbformat
          nb = nbformat.read('$nb', as_version=4)
          print(f'  {len(nb.cells)} cells, OK')
          "
          done
