[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "currency-predict-attempt"
version = "0.1.0"
description = "A machine learning project for currency exchange rate prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "yfinance>=0.2.0",
    "requests>=2.31.0",
    "jupyter>=1.0.0",
    "transformers>=4.56.2",
    "torch>=2.8.0",
    "accelerate>=1.10.1",
    "datasets>=4.1.1",
    "pydantic-settings>=2.12.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
